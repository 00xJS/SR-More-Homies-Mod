[mod]
name = More Homies
author = 00xJS
version = 0.1
description = Recruit up to 30 homies instead of 1 to 3. The game's own progression is kept: a bigger party as soon as recruiting unlocks, one more at each city-ownership award (25%% and 50%% of the hoods by default). Missions that hand you a full party get a bigger one too. Gang wars bring more gang members and cars, sooner.\n\nThe game's party list holds 10 followers; past that the extra homies are an entourage that follows and fights but is not on the HUD, does not take car seats and cannot be revived. The HUD shows up to six heads. Private play only, like any gameplay mod.

[settings]
; ---- Party size (main.lua) ----
; How many homies you can have as soon as recruiting unlocks (the game gives 1).
homies_start = 10
; How many more each city-ownership award adds (the game adds 1 at each; there are two awards).
homies_per_award = 1
; The most the party may hold, up to 30. The game's party list has 10 slots; followers past 10 are an
; "entourage": they follow and fight for you, but are not on the HUD, don't take car seats and can't be revived.
homies_cap = 10
; Party size during missions that call for a full party (the game uses 3).
mission_homies = 10
; How many follower heads the HUD shows, 3 to 6 (the game draws 3; its layout has room for 6).
hud_heads = 6

; ---- Award thresholds (patch.lua) ----
; Share of the city's hoods you must own for the second and third homie award (the game uses 0.25 and 0.5).
; These also decide when the "You can now have up to ..." unlocks appear.
second_award_at = 0.25
third_award_at = 0.5

; ---- Followers (main.lua) ----
; How far followers may fall behind before the game drops them (1.0 = the game's 40 m). Higher values leave distant followers standing still, so 1.0 is recommended.
follower_range_multiplier = 1.0

; ---- Gang wars (patch.lua) ----
; How many gang members and cars come after you at each gang notoriety level, and how much sooner (1.0 = the game's).
gang_war_multiplier = 2.0
; Chance that the gang hang-out spots on the street are populated, 0 to 1 (the game uses 0.9 for most).
gang_street_chance = 1.0
; How many gang members stand around at each gang cluster on the street (the game places 3).
gang_cluster_size = 5
; Multiplier for the gang notoriety each action earns, so wars start sooner (1.0 = the game's).
gang_notoriety_multiplier = 1.0
; Seconds between the game's ambient gang spawn ticks (the game uses 20; lower refills gang groups sooner, 20 = unchanged).
gang_spawn_interval = 10

; Write the party size the game asked for, and what it was given, to mods/wml.log whenever it changes.
debug = true
